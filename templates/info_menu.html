<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Configuration Menu</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h2>What do you want to see?</h2>

  <button type="button" onclick="document.getElementById('modelForm').style.display='block'">
    View Configurations
  </button>

  <form id="modelForm" method="GET" action="/gpt/info/device" style="display:none; margin-top: 1rem;">
    <input type="hidden" name="device_id" value="{{ device_id }}">

    <label for="ospf_model">OSPF YANG Model:</label>
    <input type="text" id="ospf_model" name="ospf_model" placeholder="e.g., Cisco-IOS-XE-native" required>
    <br><br>

    <label for="interface_model">Interface YANG Model:</label>
    <input type="text" id="interface_model" name="interface_model" placeholder="e.g., ietf-interfaces" required>
    <br><br>

    <button type="submit">Submit Models</button>
  </form>

    <br>

    <form method="GET" action="/info/routing">
      <input type="hidden" name="device_id" value="{{ device_id }}">
      <button type="submit">View Routing Information</button>
    </form>
  </div>
</body>
</html>
