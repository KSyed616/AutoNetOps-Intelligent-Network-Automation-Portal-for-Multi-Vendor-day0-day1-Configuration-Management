<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>OSPF Template Creation (Cisco IOS-XE)</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <form method="POST" action="/template/ospf">
      <h3>Cisco IOS-XE OSPF Configuration Fields</h3>

      <label>
        <input type="checkbox" name="fields" value="process-id" checked disabled>
        OSPF Process ID (mandatory)
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="router-id" checked disabled>
        Router ID (mandatory)
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="network-ip" checked disabled>
        Network IP (mandatory)
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="wildcard-mask" checked disabled>
        Wildcard Mask (mandatory)
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="area" checked disabled>
        Area (mandatory)
      </label><br>

      <h4>Optional OSPF Fields</h4>

      <label>
        <input type="checkbox" name="fields" value="passive-interface">
        Passive Interface
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="auto-cost-reference-bandwidth">
        Reference Bandwidth
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="default-information-originate">
        Originate Default Route
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="log-adjacency-changes">
        Log Adjacency Changes
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="timers-throttle-spf">
        SPF Throttle Timers
      </label><br>

      <label>
        <input type="checkbox" name="fields" value="timers-throttle-lsa">
        LSA Throttle Timers
      </label><br>

      <button type="submit">Generate Cisco OSPF Template</button>
    </form>
  </div>
</body>
</html>
