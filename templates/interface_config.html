<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Day1 Interface Configuration</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="container">
    <h2>All Interfaces</h2>
    {% for intf in interfaces %}
        <form action="/day1/interfaces/template" method="get">
            <input type="hidden" name="interface_name" value="{{ intf.name }}">
            <input type="hidden" name="interface_status" value="{{ intf.status }}">
            <input type="hidden" name="device_id" value="{{ device_id }}">
            <button type="submit">
                {{ intf.name }} - {{ intf.status }}
                {% if intf.status == 'configured' %}
                    (Reconfigure)
                {% else %}
                    (Configure)
                {% endif %}
            </button>
        </form>
    {% endfor %}
</div>
</body>
</html>
