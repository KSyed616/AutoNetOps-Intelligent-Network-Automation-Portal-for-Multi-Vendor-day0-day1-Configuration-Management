<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Configure OSPF</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="container">
    <h2>Configure OSPF on Device: {{ device_name }}</h2>

    <form method="POST" action="/day1/ospf/config">
      <input type="hidden" name="device_id" value="{{ device_id }}">

      {% for field in fields %}
        {% if field == "router_id" %}
          <label>Router ID:</label>
          <input type="text" name="router_id" placeholder="e.g. 1.1.1.1"><br>

        {% elif field == "reference_bandwidth" %}
          <label>Reference Bandwidth (Mbps):</label>
          <input type="number" name="reference_bandwidth" min="1"><br>

        {% elif field == "area_id" %}
          <label>OSPF Area ID:</label>
          <input type="text" name="area_id" placeholder="e.g. 0.0.0.0 or 0"><br>

        {% elif field == "interface_name" %}
          <label>Interface Name:</label>
          <input type="text" name="interface_name"><br>

        {% elif field == "network_type" %}
          <label>Network Type:</label>
          <select name="network_type">
            <option value="broadcast">broadcast</option>
            <option value="non_broadcast">non-broadcast</option>
            <option value="point_to_point">point-to-point</option>
            <option value="point_to_multipoint">point-to-multipoint</option>
          </select><br>

        {% elif field == "passive" %}
          <label>Passive Interface:</label>
          <input type="checkbox" name="passive"><br>
        {% endif %}
      {% endfor %}

      <button type="submit">Submit OSPF Configuration</button>
    </form>
  </div>
</body>
</html>
