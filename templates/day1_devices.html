<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Day 1 Configuration</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="container">
        <h2>Select a Device for Day 1 Configuration</h2>

        {% for device in devices %}
            <form action="/day1/interfaces" method="post">
                <input type="hidden" name="device_id" value="{{ device.device_id }}">
                <button type="submit">{{ device.hostname }}</button>
            </form>
        {% endfor %}

        <hr>
        <br>
        <a href="/dashboard">
            <button>Back to Dashboard</button>
        </a>
    </div>
</body>
</html>
