<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div class="container">
        <h2>Welcome to the Dashboard</h2>
        <p>You successfully logged in.</p>

        <div class="button-group">
            <a href="/devices" class="button-link">
                <button>View Devices</button>
            </a>

            <a href="/deploy_device" class="button-link">
                <button>Deploy Devices</button>
            </a>

            <button class="button-link" onclick="editDevice()">Edit Device</button>

            <a href="/day0_menu" class="button-link">
                <button>Day 0 Configuration</button>
            </a>

            <a href="/day1_menu" class="button-link">
                <button>Day 1 Configuration</button>
            </a>

            <a href="/template_menu" class="button-link">
                <button>Template Creation</button>
            </a>

            <a href="/" class="button-link">
                <button>Logout</button>
            </a>
        </div>
    </div>

    <script>
        function editDevice() {
            const deviceId = prompt("Enter Device ID to edit:");
            if (deviceId) {
                window.location.href = `/devices/deploy_edit/${deviceId}`;
            }
        }
    </script>
</body>
</html>
